[project]
name = "nawia"
version = "0.1.1"
dependencies = [
    "pandas>=2.2.0",
    "streamlit>=1.35.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary",
    "plotly"
]

[project.scripts]
nawia = "nawia.cli:main"

[tool.setuptools]
packages = ["nawia", "nawia.commands"]

[tool.setuptools.data-files]
"." = ["config.json"]
templates = ["templates/default_config.json"]