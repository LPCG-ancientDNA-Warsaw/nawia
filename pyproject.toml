[project]
name = "nawia"
version = "0.1.1"
dependencies = [
    "pandas>=2.2.0",
    "streamlit>=1.35.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary",
    "plotly"
]

[project.scripts]
nawia = "nawia.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["nawia*"]
namespaces = true

[tool.setuptools.package-data]
nawia = [
    "resources/config.json",
    "resources/templates/*",
    "resources/templates/config_presets/*.json",
    "resources/static/*",
    "resources/sql/*",
]